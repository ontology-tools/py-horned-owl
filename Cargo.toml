[package]
name = "py-horned-owl"
version = "2.0.0"
authors = ["Janna Hastings <j.hastings@ucl.ac.uk>", "Björn Gehrke <bjoern.gehrke+pyhornedowl@idiap.ch>"]
edition = "2021"
license = "LGPL-3.0-or-later"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name="pyhornedowl"
crate-type=["cdylib", "rlib"]

[dependencies.pyo3]
version = "0.29"
features = ["experimental-inspect", "multiple-pymethods"]

[dependencies]
horned-owl = "^3.0"
horned-bin = "^3.0"
# horned-owl = { git = "https://github.com/phillord/horned-owl.git", branch = "devel" }
# horned-bin = { git = "https://github.com/phillord/horned-owl.git", branch = "devel" }
py-horned-owl-reasoner = { path = "lib/reasoner" }
curie = "0.1.2"
libloading = "0.8"
oxrdfio = "0.2.5"

[profile.dev]
opt-level=3
