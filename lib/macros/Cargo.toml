[package]
name = "py-horned-owl-macros"
version = "0.1.0"
edition = "2021"
license = "LGPL-3.0-or-later"
description = "Attribute macros that declare the Python classes of py-horned-owl's model"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
